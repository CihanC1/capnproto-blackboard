[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "capnproto-blackboard"
version = "1.0.0"
description = "Seminar demo: a shared blackboard and remote directory listing over Cap'n Proto RPC (pycapnp)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pycapnp>=2.0.0,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
]

[project.scripts]
capnp-demo-server = "capnproto_demo.server:main"
capnp-demo-client = "capnproto_demo.client:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["tests"]
